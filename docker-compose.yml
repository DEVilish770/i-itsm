# One-command startup:  docker compose up --build
# Frontend  → http://localhost:5173      Backend API → http://localhost:8080      Postgres → localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/itsm
      DB_USER: itsm
      DB_PASSWORD: itsm
      # No committed fallback. Unset = random signing key per start (everyone signs in again after a restart);
      # to keep logins across restarts, set JWT_SECRET (32+ bytes) in your shell or in the private env file below.
      JWT_SECRET: ${JWT_SECRET:-}
      # Demo speed: SLA sweep every 10 s, unacknowledged P1/P2 escalate after 2 min (app defaults: 30 s / 10 min)
      SLA_MONITOR_SECONDS: 10
      ESCALATION_MINUTES: 2
      # Timestamps are stored and sent without a zone, so the backend clock must match the users' (IST)
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
      # Claude features: keep the key OUTSIDE this project and outside any synced folder (Google Drive, iCloud,
      # OneDrive, Dropbox), e.g. in ~/.config/i-itsm/ai.env, and start with:
      #   docker compose --env-file ~/.config/i-itsm/ai.env up --build -d
      # A key already exported in your shell wins over the env file and switches the AI on (billed to that key).
      # Unset or blank = every AI feature uses its rules fallback. ITSM_AI_ENABLED=false starts with AI switched off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ITSM_AI_ENABLED: ${ITSM_AI_ENABLED:-true}
      ITSM_AI_DAILY_LIMIT: ${ITSM_AI_DAILY_LIMIT:-150}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
