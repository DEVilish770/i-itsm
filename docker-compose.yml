# One-command startup:  docker compose up --build
# Frontend  → http://localhost:5173      Backend API → http://localhost:8080      Postgres → localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/itsm
      DB_USER: itsm
      DB_PASSWORD: itsm
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-64-char-secret-before-any-real-deployment!!}
      SLA_MONITOR_SECONDS: 15
      ESCALATION_MINUTES: 5
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
