# Zero-setup profile: in-memory H2, so `mvn spring-boot:run -Dspring-boot.run.profiles=dev` works without Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:itsm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
itsm:
  sla:
    monitor-seconds: 10
  escalation:
    minutes: 2
