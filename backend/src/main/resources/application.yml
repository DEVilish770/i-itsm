spring:
  application:
    name: i-itsm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USER:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    hibernate:
      ddl-auto: update          # dev convenience; the SQL schema in docs/ is the reference DDL
    open-in-view: false
    properties:
      hibernate.format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

itsm:
  jwt:
    secret: ${JWT_SECRET:}       # no committed default: unset = random key per start (see JwtService)
    ttl-minutes: 480
  sla:
    monitor-seconds: ${SLA_MONITOR_SECONDS:30}
  escalation:
    minutes: ${ESCALATION_MINUTES:10}
  duplicate:
    threshold: 0.25
    window-hours: 48
  seed:
    enabled: ${SEED_ENABLED:true}
  # Claude features. The API key is read only from the ANTHROPIC_API_KEY environment variable (never from this file);
  # without it every feature runs on its rules fallback. An admin can switch AI on/off at runtime (PUT /api/admin/ai).
  ai:
    enabled: ${ITSM_AI_ENABLED:true}
    model: claude-sonnet-5-5
    daily-limit: ${ITSM_AI_DAILY_LIMIT:150}   # calls per day; the count restarts at midnight Asia/Kolkata
    timeouts:
      triage: 8s
      chat: 8s
      search: 8s
      status: 6s
      summary: 8s

logging:
  level:
    edu.bits.itsm: INFO
