spring:
  datasource:
    url: jdbc:h2:mem:itsm-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
itsm:
  seed:
    enabled: true
  sla:
    monitor-seconds: 3600
  # Tests never call Claude: rules mode here even if ANTHROPIC_API_KEY happens to be set on the machine.
  # AI tests switch it on explicitly and replace the gateway with a fake (see ai/FakeAiGateway).
  ai:
    enabled: false
