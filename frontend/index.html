<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f0e0c" />
    <title>I-ITSM · Intelligent IT Service Management</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Cg fill='%23c9a24e'%3E%3Ccircle cx='4' cy='4' r='1.9' opacity='.45'/%3E%3Ccircle cx='11' cy='4' r='1.9' opacity='.7'/%3E%3Ccircle cx='18' cy='4' r='1.9'/%3E%3Ccircle cx='4' cy='11' r='1.9' opacity='.45'/%3E%3Ccircle cx='11' cy='11' r='1.9' opacity='.7'/%3E%3Ccircle cx='18' cy='11' r='1.9'/%3E%3Ccircle cx='4' cy='18' r='1.9' opacity='.45'/%3E%3Ccircle cx='11' cy='18' r='1.9' opacity='.7'/%3E%3Ccircle cx='18' cy='18' r='1.9'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Pick the theme before the first paint: the saved choice, else the OS setting. Storage may be blocked.
      (function () {
        var t = null
        try { t = localStorage.getItem('itsm.theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark' } catch (e) { t = 'dark' }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <style>
      html { background: #0f0e0c; }
      html[data-theme='light'] { background: #f3eee5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
