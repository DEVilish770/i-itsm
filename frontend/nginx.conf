server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Screenshots for "screenshot to ticket" travel as base64 JSON (about 1 MB); nginx's default limit is 1 MB.
  client_max_body_size 10m;

  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_read_timeout 120s; }
  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
}
